services:
  - type: web
    name: telegram-drive-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.14
      - key: BOT_TOKEN
        sync: false
      - key: TOKEN_PICKLE_B64
        sync: false
    plan: free
